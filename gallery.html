<!-- Lightbox -->
<div class="lb-overlay" id="lb" role="dialog" aria-modal="true" aria-label="写真ビューアー" aria-hidden="true">
  <button class="lb-close" id="lb-close" aria-label="Close">&#x2715;</button>
  <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous">&#x2039;</button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next" aria-label="Next">&#x203a;</button>
</div>

<script>
document.querySelectorAll(".nav-links a").forEach(link => {
  link.addEventListener("click", () => document.querySelector(".nav-links").classList.remove("open"));
});

document.querySelectorAll(".month-group[hidden]").forEach(group => {
  if (group.querySelector(".photo-item")) group.hidden = false;
});

(function() {
  const items = Array.from(document.querySelectorAll(".photo-item[data-src]"));
  const overlay = document.getElementById("lb");
  const lbImg = document.getElementById("lb-img");
  const closeButton = document.getElementById("lb-close");
  let current = 0;
  let returnFocus = null;
  let touchStartX = 0;
  let touchStartY = 0;

  function open(index) {
    current = index;
    const item = items[current];
    lbImg.src = item.dataset.src;
    lbImg.alt = item.querySelector("img").alt;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    closeButton.focus();
  }

  function close() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (returnFocus) returnFocus.focus();
  }

  function prev() { open((current - 1 + items.length) % items.length); }
  function next() { open((current + 1) % items.length); }

  items.forEach((item, i) => {
    const label = item.querySelector("img").alt;
    item.setAttribute("role", "button");
    item.setAttribute("tabindex", "0");
    item.setAttribute("aria-label", `${label}を拡大表示`);
    const activate = () => { returnFocus = item; open(i); };
    item.addEventListener("click", activate);
    item.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activate();
      }
    });
  });
  closeButton.addEventListener("click", close);
  document.getElementById("lb-prev").addEventListener("click", prev);
  document.getElementById("lb-next").addEventListener("click", next);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  lbImg.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
  }, { passive: true });
  lbImg.addEventListener("touchend", event => {
    if (event.changedTouches.length !== 1) return;
    const deltaX = event.changedTouches[0].clientX - touchStartX;
    const deltaY = event.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.2) return;
    if (deltaX < 0) next();
    else prev();
  }, { passive: true });
  document.addEventListener("keydown", e => {
    if (!overlay.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "ArrowRight") next();
    if (e.key === "Tab") {
      const controls = Array.from(overlay.querySelectorAll("button"));
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>
