<!-- Lightbox -->
<div class="lb-overlay" id="lb" role="dialog" aria-modal="true">
  <button class="lb-close" id="lb-close" aria-label="Close">&#x2715;</button>
  <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous">&#x2039;</button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next" aria-label="Next">&#x203a;</button>
</div>

<script>
document.querySelectorAll(".nav-links a").forEach(link => {
  link.addEventListener("click", () => document.querySelector(".nav-links").classList.remove("open"));
});

document.querySelectorAll(".month-group[hidden]").forEach(group => {
  if (group.querySelector(".photo-item")) group.hidden = false;
});

(function() {
  const items = Array.from(document.querySelectorAll(".photo-item[data-src]"));
  const overlay = document.getElementById("lb");
  const lbImg = document.getElementById("lb-img");
  let current = 0;

  function open(index) {
    current = index;
    const item = items[current];
    lbImg.src = item.dataset.src;
    lbImg.alt = item.querySelector("img").alt;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function close() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  }

  function prev() { open((current - 1 + items.length) % items.length); }
  function next() { open((current + 1) % items.length); }

  items.forEach((item, i) => item.addEventListener("click", () => open(i)));
  document.getElementById("lb-close").addEventListener("click", close);
  document.getElementById("lb-prev").addEventListener("click", prev);
  document.getElementById("lb-next").addEventListener("click", next);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", e => {
    if (!overlay.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "ArrowRight") next();
  });
})();
</script>
